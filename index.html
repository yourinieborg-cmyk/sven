<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sven z'n uren</title>
  <meta name="description" content="Houd je gewerkte uren en verwachte bruto loon bij.">
  <meta name="theme-color" content="#eef2f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sven z'n uren">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="view-today" class="view" data-title="Vandaag"></section>
    <section id="view-hours" class="view" data-title="Uren" hidden></section>
    <section id="view-schedule" class="view" data-title="Rooster" hidden></section>
    <section id="view-settings" class="view" data-title="Instellingen" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Navigatie">
    <button class="tab active" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Vandaag</span>
    </button>
    <button class="tab" data-view="hours">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
      <span>Uren</span>
    </button>
    <button class="tab" data-view="schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Rooster</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      <span>Instellingen</span>
    </button>
  </nav>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="confirm-backdrop" class="backdrop top" hidden></div>
  <div id="confirm" class="sheet top" role="alertdialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Zet JavaScript aan om Sven z'n uren te gebruiken.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
